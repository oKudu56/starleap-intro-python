<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="overlay" class="overlay hidden"></div>
  <div id="hud" class="hud">
    <div id="message">A tiny random generator — click Randomize for a new result.</div>
    <div style="margin-top:8px;">
      <button id="randomize">Randomize</button>
      <button id="share">Copy</button>
    </div>
  </div>
  <main id="main">
    <section id="haiku" class="panel"></section>
    <section id="palette" class="panel"></section>
    <canvas id="doodle" class="panel"></canvas>
  </main>

  <script type="module">
    import('./app.js').catch(err => { const overlay = document.getElementById('overlay'); overlay.classList.remove('hidden'); overlay.innerText = 'Module load/runtime error:\n' + (err && err.stack ? err.stack : String(err)); console.error(err); });
  </script>
</body>
</html>
